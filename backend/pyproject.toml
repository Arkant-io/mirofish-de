[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11.5,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Sicherheits-Overrides (ARKANT-292): camel-oasis 0.2.5 pinnt pillow, unstructured
# und sentence-transformers exakt auf Staende mit kritischen Luecken (SSRF,
# Pfad-Traversal, RCE); camel-ai 0.2.78 verlangt pillow<11. Overrides heben sie
# auf behobene Versionen. Uebrige transitive Pakete per `uv lock --upgrade-package`.
[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "unstructured>=0.24.0",
    "nltk>=3.10.3",
    "sentence-transformers>=5.6.0",
    "transformers>=5.5.0",
    # unstructured>=0.24 braucht psutil>=7.2.2, camel-ai 0.2.78 verlangt <6
    "psutil>=7.2.2",
    # camel-oasis pinnt pytest==8.2.0 als Laufzeit-Abhaengigkeit
    "pytest>=9.0.3",
    # mcp 2.x entfernt mcp.server.FastMCP, das camel-ai 0.2.78 importiert
    "mcp>=1.24.0,<2",
]
